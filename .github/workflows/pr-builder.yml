name: PR Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-hash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-and-hashes
          path: dist/
          retention-days: 7
